<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <h2>Crop Research</h2>
        <input type="text" id="crop-el" placeholder="Crop name (lettuce, basil, etc.)">
        <select id="method-el">
            <option value="">Growing method</option>
            <option value="Hydroponic">Hydroponic</option>
            <option value="Soil-based">Soil-based</option>
        </select>
        <input type="text" id="category-el" placeholder="Research category (pH, lighting, etc.)">
        <textarea id="note-el" placeholder="Short research note"></textarea>
        <input type="text" id="url-el" placeholder="Website URL">
        <button id="input-btn">SAVE RESEARCH</button>
        <button id="tab-btn">SAVE TAB URL</button>
        <button id="delete-btn">DELETE ALL</button>
        <ul id="ul-el"></ul>
        <script src="index.js"></script>
    </body>
</html>
